name: Publish RISE static website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'dark-theme.css'
      - 'abstract-matcher.css'
      - 'accessibility.css'
      - 'editorial-design.css'
      - 'abstract-matcher.js'
      - 'app.js'
      - 'data.json'
      - 'data.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and assemble static-only website
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          root=Path('.')
          allowed=(
            'index.html','app.js','abstract-matcher.js','data.js','data.json',
            'styles.css','dark-theme.css','abstract-matcher.css',
            'accessibility.css','editorial-design.css'
          )
          for name in allowed:
              if not (root/name).is_file():
                  raise SystemExit(f'Missing public site asset: {name}')
          records=json.loads((root/'data.json').read_text(encoding='utf-8'))
          if not isinstance(records.get('conferences'),list) or not isinstance(records.get('awards'),list):
              raise SystemExit('Invalid RISE conference data schema')
          if 'window.RISE_DATA' not in (root/'data.js').read_text(encoding='utf-8'):
              raise SystemExit('Public data.js missing conference data')
          out=root/'dist'
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          for name in allowed: shutil.copy2(root/name,out/name)
          (out/'.nojekyll').touch()
          print(f'Publishing {len(records["conferences"])} conferences and {len(records["awards"])} awards from public static assets')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deploy
        uses: actions/deploy-pages@v4
