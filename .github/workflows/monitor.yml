name: Monitor and auto-publish RISE
on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: rise-weekly-source-and-publish
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      website_changed: ${{ steps.commit.outputs.website_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test date extraction and publication rules
        run: python -m unittest discover -s tests -v
      - name: Restore previous page fingerprints
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.source_cache.json
          key: rise-source-cache-${{ github.run_id }}
          restore-keys: |
            rise-source-cache-
      - name: Scan official conference sources
        run: python -m pipeline.cli scan --all --delay 0.7 --timeout 13
      - name: Publish unambiguous date changes; hold uncertain ones
        run: python -m pipeline.auto_publish --max-updates 8
      - name: Validate updated database and run tests
        run: |
          python -m pipeline.cli validate
          python -m unittest discover -s tests -v
      - name: Commit validated browser data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add data.json data.js
          if git diff --cached --quiet; then
            echo "website_changed=false" >> "$GITHUB_OUTPUT"
            echo "No eligible updates; website unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "RISE: automatic official date updates"
            git push origin HEAD:main
            echo "website_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Produce unpublished next-cycle drafts
        shell: bash
        run: |
          YEAR=$(date -u +%Y)
          python -m pipeline.cli draft-cycle --year "$((YEAR + 1))"
          python -m pipeline.cli draft-cycle --year "$((YEAR + 2))" --out pipeline/reports/following_year_draft.json
      - name: Store fingerprints
        uses: actions/cache/save@v4
        with:
          path: pipeline/.source_cache.json
          key: rise-source-cache-${{ github.run_id }}
      - name: Upload source audit and publication summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rise-review-${{ github.run_id }}
          path: pipeline/reports/
          retention-days: 90
          if-no-files-found: warn
  build_pages:
    needs: monitor
    if: needs.monitor.outputs.website_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests and build site
        run: |
          python -m unittest discover -s tests -v
          python -m pipeline.build_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy_pages:
    needs: build_pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy validated RISE data to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
